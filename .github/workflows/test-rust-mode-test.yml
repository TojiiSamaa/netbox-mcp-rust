name: test-rust-mode-test
on:
  pull_request:
    paths: ["rust/**", "skill/**"]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tests (network on)
        run: |
          docker run --rm -v "$PWD/rust:/w" -v nbmcp-target:/t -v nbmcp-cargo:/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/t -w /w rust:1-alpine sh -c "apk add --no-cache build-base && cargo test --no-run"
      - name: Run all tests in a container without network
        run: |
          docker run --rm --network none -v "$PWD/rust:/w" -v nbmcp-target:/t -v nbmcp-cargo:/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/t -e NBMCP_ISOLATED=1 -w /w rust:1-alpine cargo test --offline
      - name: Mutation check (static and binary proofs must fail)
        run: |
          docker run --rm --network none -v "$PWD/rust:/w" -v nbmcp-target:/t -v nbmcp-cargo:/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/t -w /w rust:1-alpine sh scripts/mutation-check.sh
