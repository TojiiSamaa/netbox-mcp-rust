name: Release and package (Rust)

# One workflow, one chain: image on GHCR (linux/amd64 + arm64) -> GitHub Release.
# The Release is created only after the image is published, in the same run, so
# the two always match (a tag created with GITHUB_TOKEN would not trigger another
# workflow, which is why this is not split in two).
#   Tag push `vX.Y.Z`  -> builds that tag.
#   Manual run         -> builds the current commit and creates the tag `v<version>`.
# `version` must equal the one in rust/Cargo.toml, so the binary reports what the tag says.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (default: the one in rust/Cargo.toml)"
        required: false

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          if [ "${REF_TYPE}" = "tag" ]; then version="${REF_NAME#v}"; else version="${INPUT:-${cargo_version}}"; version="${version#v}"; fi
          if [ "${version}" != "${cargo_version}" ]; then
            echo "::error::version ${version} differs from rust/Cargo.toml (${cargo_version}); bump Cargo.toml first"; exit 1
          fi
          case "${version}" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=${version}"
            echo "prerelease=${pre}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: rust
          file: rust/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nbmcp
            org.opencontainers.image.description=MCP server for NetBox (Rust): read, guarded write, plugins
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  package:
    name: Multi-arch manifest (GHCR)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          major_minor="${VERSION%.*}"; major="${VERSION%%.*}"
          tags=(--tag "${IMAGE}:${VERSION}")
          if [ "${PRERELEASE}" = "false" ]; then tags+=(--tag "${IMAGE}:latest" --tag "${IMAGE}:${major_minor}" --tag "${IMAGE}:${major}"); fi
          sources=(); for f in *; do sources+=("${IMAGE}@sha256:${f}"); done
          # The `source` annotation on the index is what links the package to this repository on GitHub.
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  release:
    name: GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Create the release (the tag is created on this commit if it does not exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          ## Docker image

          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Multi-arch (linux/amd64, linux/arm64). Over HTTP it needs \`NETBOX_MCP_TOKEN\` (or \`NETBOX_TOKEN_PASSTHROUGH=true\`); writes stay off unless \`NETBOX_ALLOW_WRITES=true\`. See the README.
          EOF
          flags=(--title "v${VERSION}" --generate-notes --notes-file notes.md)
          [ "${PRERELEASE}" = "true" ] && flags+=(--prerelease)
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, nothing to do."
          else
            gh release create "v${VERSION}" --target "${GITHUB_SHA}" "${flags[@]}"
          fi
