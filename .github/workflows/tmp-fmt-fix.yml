name: tmp-fmt-fix
# TEMPORAIRE (retire avant fusion) : applique cargo fmt sur rust/ et pousse le commit sur la branche de la PR.
on:
  push:
    branches: ["ci/rust-tests-1112"]
    paths: [".github/workflows/tmp-fmt-fix.yml"]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: fmt
        working-directory: rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo fmt --all
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git diff --cached --quiet || { git commit -m "style(rust): cargo fmt --all (le format n'etait pas applique)" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>"; git push; }
      - name: clippy (info)
        working-directory: rust
        continue-on-error: true
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test (info)
        working-directory: rust
        continue-on-error: true
        run: cargo test --locked
